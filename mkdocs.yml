site_name: My Documentation Site
site_url: https://neal777.github.io/neal777.guthub.io/

site_name: My Documentation Site

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Introduction: intro.md
  - How-to guides:
      - How-to guide template: how_to_guide_template.md
  - Explanations:
      - Explanation template: explanation_template.md 
  - Reference:
      - Reference template: reference_template.md
  - Tutorials:
      - Tutorial template: tutorial_template.md

